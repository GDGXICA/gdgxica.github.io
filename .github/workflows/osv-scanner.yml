name: OSV Scanner

on:
  schedule:
    - cron: "0 8 * * 1" # weekly, Monday — same cadence as Dependabot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-scheduled:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      scan-args: |-
        -r
        --skip-git
        ./
      fail-on-vuln: false
