name: OSV Scanner

on:
  schedule:
    - cron: "0 8 * * 1" # weekly, Monday — same cadence as Dependabot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-scheduled:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        -r
        --skip-git
        ./
      fail-on-vuln: false
