name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [data-updated]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.15.0"
          cache: pnpm

      - name: Setup Java (for Firestore emulator)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache npm (Cloud Functions)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cloud Functions dependencies
        run: cd functions && npm ci

      - name: Run unit tests (root)
        run: pnpm test

      - name: Run Cloud Functions tests
        run: pnpm test:functions

      - name: Run security rules tests
        run: pnpm test:rules

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.15.0"
          cache: pnpm

      - name: Cache npm (Cloud Functions)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch gdg-ica-data
        run: |
          git clone --depth 1 https://github.com/GDGXICA/gdg-ica-data.git /tmp/gdg-data
          cp -r /tmp/gdg-data/images/* public/

      - name: Build project
        env:
          GDG_DATA_LOCAL_PATH: /tmp/gdg-data
        run: pnpm run build

      - name: Install Cloud Functions dependencies
        run: cd functions && npm ci

      - name: Build Cloud Functions
        run: cd functions && npm run build

      - name: Install Firebase CLI
        run: pnpm add -g firebase-tools@15.14.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: |
          firebase deploy --project appgdgica --only "hosting:gdgica,functions,firestore:rules,firestore:indexes,storage"
